[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical_triage"
version = "1.0.0"
description = "AI Medical Triage Assistant — OpenEnv RL Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "openenv-core>=0.2.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "python-multipart",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["triage_env", "grader", "inference"]
packages = ["server"]
